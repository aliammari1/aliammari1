name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize]

# Gated on ANTHROPIC_API_KEY: the job is skipped entirely on forks /
# when the secret is absent, so this never errors for contributors.
permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Claude review
        if: ${{ env.HAS_KEY == 'true' }}
        uses: anthropics/claude-code-action@9db594c7a0e82298c121c18b7f08aa1579ce7341 # v1.0.185
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review this pull request to the profile README repository.
            Focus on: workflow YAML correctness, action SHA-pinning hygiene,
            least-privilege permissions, and broken README links/badges.
            Keep feedback short and only flag real issues.
