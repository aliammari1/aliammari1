name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize]

# Gated on ANTHROPIC_API_KEY: the job is skipped entirely on forks /
# when the secret is absent, so this never errors for contributors.
permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Claude review
        if: ${{ env.HAS_KEY == 'true' }}
        uses: anthropics/claude-code-action@19dda84776b3518d98b8798e591daee763049ed3 # v1.0.220
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review this pull request to the profile README repository.
            Focus on: workflow YAML correctness, action SHA-pinning hygiene,
            least-privilege permissions, and broken README links/badges.
            Keep feedback short and only flag real issues.
